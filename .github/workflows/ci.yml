name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck the app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck the server
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
